; EUC Stabilized Headlight firmware (docs/firmware-spec.md).
;
; Host tests (no board needed):   pio test -e native
; Board build:                    pio run -e xiao_esp32s3
;
; The board uses Arduino-ESP32 3.x through the community pioarduino platform,
; pinned to one release (design §7, decided 2026-11-22). The official PlatformIO
; platform only ships 2.0.17. To move to a newer release, pick one at least 14 days
; old and update the URL and its digest below.
;
; Pure logic lives in lib/headlight_core: no Arduino, no clock, no hardware I/O.
; Every test function's name starts with its test-plan ID (docs/test-plan.md), and
; test_plan checks the two agree (U-PLAN-01).

[platformio]
default_envs = native

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -DHL_PROJECT_DIR=\"$PROJECT_DIR\"
; src/ is the Arduino entry point; the host only builds the library and tests.
build_src_filter = -<*>

[env:xiao_esp32s3]
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5, released 2026-09-22.
; platform-espressif32.zip sha256 f147d4ec6d657f451742df497811ebe3377db583ffd2e321e34b3793ff6b20a2
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11 -std=gnu++2b
